name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, API, mobile)
        run: npm run typecheck
      - name: Shared rules and API end-to-end tests
        run: npm test
      - name: Database migrations, RLS and history-integrity tests
        run: npm run test:db
